name: Build and publish desktop release

on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# Finish a publication transaction before another candidate can publish.
concurrency:
  group: musicops-desktop-publication
  cancel-in-progress: false

jobs:
  windows:
    name: Windows application and native installer
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.identity.outputs.version }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Verify exact source and read release version
        id: identity
        shell: python
        run: |
          import os, pathlib, re, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))['project']['version']
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or commit != os.environ['EXPECTED_COMMIT']:
              raise SystemExit('Invalid version or source commit mismatch')
          installer = pathlib.Path('packaging/MusicOps-go.iss').read_text('utf-8')
          if re.search(r'^\s*#define AppVersion "([^"]+)"', installer, re.M)[1] != '0.0.0-dev':
              raise SystemExit('Go installer must carry only the 0.0.0-dev fallback')
          if 'VersionInfoVersion={#AppVersion}.0' not in installer or 'OutputBaseFilename=MusicOps-{#AppVersion}-Setup' not in installer:
              raise SystemExit('Go installer version wiring does not match the release flow')
          if 'MusicOpsVersion' in installer:
              raise SystemExit('Go installer must not reference the legacy MusicOpsVersion define')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('version=' + version + '\n')
      - name: Set up pinned Go for bundled engines
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: native/core/go.sum
      - name: Install PyInstaller for the Windows version-resource test
        run: |
          python -m pip install pyinstaller==6.22.3 pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed' }
      - name: Install media tools and locate the real Inno compiler
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'FFmpeg installation failed' }
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Inno Setup installation failed' }
          $compilerPath = @('Inno Setup 7', 'Inno Setup 6') | ForEach-Object { Join-Path ${env:ProgramFiles(x86)} "$_\ISCC.exe" } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compilerPath) { throw 'The native installer compiler was not found' }
          "INNO_ISCC=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ffmpeg -version
          ffprobe -version
      - name: Verify generated Windows version resources before freezing
        run: |
          python -m pytest tests/test_release_versions.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Release version tests failed' }
      - name: Compile and test the native installer before the longer regression suite
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/reports | Out-Null
          python -m pytest tests/test_windows_installer.py -q --junitxml=dist/windows/reports/native-installer-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Native installer regression tests failed' }
          required = {
              'test_real_fresh_install_then_detected_update_preserves_data_and_location',
              'test_registered_update_refuses_second_directory',
              'test_downgrade_is_refused_before_replacing_files',
              'test_running_worker_blocks_update_without_terminating_it',
              'test_portable_directory_is_detected_as_update',
              'test_stale_install_registration_does_not_prevent_fresh_install',
          }
          cases = {case.attrib['name']: case for case in ET.parse('dist/windows/reports/native-installer-tests.xml').iter('testcase')}
          for name in required:
              if name not in cases or any(child.tag in {'skipped', 'failure', 'error'} for child in cases[name]):
                  raise SystemExit('A required native installer test did not pass: ' + name)
      - name: Test and vet the Go core
        shell: bash
        working-directory: native/core
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test ./... -count=1 -timeout=120s
          go vet ./...
      - name: Freeze the Go application and build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve the real ffmpeg/ffprobe binaries: `choco install ffmpeg`
          # only puts shim launchers on PATH; copying a shim into the bundle
          # would ship a ffmpeg.exe that cannot run without its .shim file.
          $chocoLib = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $ffmpeg = Get-ChildItem -LiteralPath (Join-Path $chocoLib 'lib\ffmpeg\tools') -Recurse -Filter 'ffmpeg.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath (Join-Path $chocoLib 'lib\ffmpeg\tools') -Recurse -Filter 'ffprobe.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'The real ffmpeg/ffprobe binaries were not found under the Chocolatey ffmpeg package' }
          # Scrub the Chocolatey shims from PATH for this step so the Go
          # smoke inside the build script exercises the bundled
          # ffmpeg/ffprobe copies instead of the shims on PATH
          # (checkFFmpeg prefers PATH first).
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*chocolatey*bin*' }) -join ';'
          & ./packaging/build_windows_go.ps1 -Version '${{ steps.identity.outputs.version }}' -Python (Get-Command python).Source -Ffmpeg $ffmpeg.FullName -Ffprobe $ffprobe.FullName -Compiler $env:INNO_ISCC
          if ($LASTEXITCODE -ne 0) { throw 'Go application build failed' }
          Copy-Item -LiteralPath work/build-go/smoke-windows.json -Destination dist/windows/reports/go-smoke.json
          Copy-Item -LiteralPath work/build-go/installer-windows.json -Destination dist/windows/reports/go-installer.json
      - name: Stage the shipping Windows installer and verify packaged versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path -LiteralPath dist/MusicOps-Windows).Path
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $output = (Resolve-Path -LiteralPath release-assets).Path
          $installer = Get-ChildItem -LiteralPath dist/installer -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The Go build produced no Windows installer' }
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $output ('MusicOps-' + '${{ steps.identity.outputs.version }}' + '-Setup.exe'))
          $expectedVersion = '${{ steps.identity.outputs.version }}.0'
          foreach ($name in @('MusicOps.exe', 'musicops-core.exe')) {
            if ((Get-Item -LiteralPath (Join-Path $bundle $name)).VersionInfo.FileVersion -ne $expectedVersion) { throw 'Packaged executable version mismatch' }
          }
      - name: Archive audited runtime and exact Git source with build manifest
        shell: python
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          import hashlib, json, os, pathlib, subprocess, zipfile
          version = os.environ['RELEASE_VERSION']; commit = os.environ['EXPECTED_COMMIT']
          root = pathlib.Path('release-assets'); bundle = pathlib.Path('dist/MusicOps-Windows')
          report = json.loads(pathlib.Path('dist/windows/reports/go-smoke.json').read_text('utf-8'))
          installed = json.loads(pathlib.Path('dist/windows/reports/go-installer.json').read_text('utf-8'))
          required = {'bundle_no_python','core_present_and_executable','desktop_present_and_executable','core_is_go_built','core_version','desktop_is_go_built','desktop_version','core_version_matches','manifest_hashes_match','engines_present','ffmpeg_present','core_starts_and_serves_healthz','webui_requires_auth','webui_loads_with_auth','jobs_api_empty','settings_api','library_api_empty','duplicate_scan_empty','parallel_api_calls','search_synthetic_end_to_end','review_skip','cookie_never_persisted','transcode_roundtrip'}
          if report['version'] != version or report.get('passed') is not True or set(report.get('checks', {})) != required or not all(report['checks'].values()):
              raise SystemExit('Go bundle smoke evidence is incomplete')
          if installed.get('version') != version or installed.get('passed') is not True or len(installed.get('checks', {})) != 6 or not all(installed['checks'].values()):
              raise SystemExit('Go installer acceptance is incomplete')
          if report['checks'].get('engines_present') is not True:
              raise SystemExit('Bundled engines were not accepted')
          def private_path(path):
              return any(part.lower() in {'.git', '.env', 'profile', 'profiles', 'private-profile-backup-0', 'private-profile-backup-1'} for part in path.parts) or path.suffix.lower() in {'.sqlite', '.sqlite3', '.db', '.ncm', '.torrent'}
          files = sorted(path for path in bundle.rglob('*') if path.is_file() and path.name != 'manifest.json')
          if any(private_path(path.relative_to(bundle)) for path in files):
              raise SystemExit('Private runtime data is not publishable')
          def hashes(path):
              result = {}
              for algorithm in ('sha256', 'sha512'):
                  with path.open('rb') as stream: result[algorithm] = hashlib.file_digest(stream, algorithm).hexdigest()
              return result
          manifest = [{'path': path.relative_to(bundle).as_posix(), 'size': path.stat().st_size, 'sha256': hashes(path)['sha256']} for path in files]
          (bundle/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', 'utf-8')
          portable = root/f'MusicOps-{version}-Windows.zip'
          with zipfile.ZipFile(portable, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(bundle.rglob('*')):
                  if path.is_file(): archive.write(path, 'MusicOps-Windows/'+path.relative_to(bundle).as_posix())
          source = root/f'MusicOps-{version}-source.zip'
          subprocess.run(['git', 'archive', '--format=zip', '--prefix=MusicOps-'+version+'/', '--output='+str(source), commit], check=True)
          with zipfile.ZipFile(source) as archive:
              synthetic_fixture = 'MusicOps-'+version+'/tests/fixtures/providers/synthetic.ncm'
              if archive.comment.decode('ascii') != commit or any(name != synthetic_fixture and private_path(pathlib.PurePosixPath(name)) for name in archive.namelist()):
                  raise SystemExit('Source archive contains private state or has the wrong commit')
              required_licenses = {'MusicOps-'+version+'/LICENSE', 'MusicOps-'+version+'/packaging/THIRD-PARTY-NOTICES.md', 'MusicOps-'+version+'/docs/references/PlaylistOut-LICENSE.txt', 'MusicOps-'+version+'/packaging/Languages/LICENSE'}
              if not required_licenses.issubset(archive.namelist()):
                  raise SystemExit('Source archive is missing license notices')
          installer = root/f'MusicOps-{version}-Setup.exe'
          artifacts = {path.name: hashes(path) for path in (installer, portable, source)}
          data = {'managed_engines_passed': True, 'managed_engine_checks': {'engines_present': True}, 'version': version, 'architecture': 'x86_64', 'commit': commit, 'artifacts': artifacts,
                  'unit_tests_passed': True, 'installer_smoke_passed': True, 'installer_test_count': 6,
                  'installer_smoke_checks': installed['checks'],
                  'smoke_passed': True, 'packaged_checks': report['checks'],
                  'core_version': version, 'desktop_version': version,
                  'source_archive_commit': commit, 'media_tools_bundled': True}
          (root/f'MusicOps-{version}-Windows-build.json').write_text(json.dumps(data, indent=2)+'\n', 'utf-8')
      - name: Save Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: MusicOps-Windows-release
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Save Windows test and packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MusicOps-Windows-release-acceptance
          path: dist/windows/reports/*
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: Apple Silicon native installer
    needs: [windows]
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/macos-release.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.windows.outputs.version }}

  linux:
    name: Linux amd64 native HTML WebUI
    needs: [windows]
    uses: ./.github/workflows/docker-release.yml
    with:
      version: ${{ needs.windows.outputs.version }}
    secrets: inherit

  publish:
    name: Publish only the complete verified desktop release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.windows.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: MusicOps-Windows-release
          path: release-assets
      - name: Download Apple Silicon release assets
        uses: actions/download-artifact@v8
        with:
          name: MusicOps-macOS-arm64
          path: release-assets
      - name: Validate all six assets, create draft, upload, verify and publish
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, subprocess, urllib.error, urllib.request, zipfile
          version = os.environ['RELEASE_VERSION']; commit = os.environ['RELEASE_COMMIT']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Invalid release identity')
          go_checks = {'bundle_no_python','core_present_and_executable','desktop_present_and_executable','core_is_go_built','core_version','desktop_is_go_built','desktop_version','core_version_matches','manifest_hashes_match','engines_present','ffmpeg_present','core_starts_and_serves_healthz','webui_requires_auth','webui_loads_with_auth','jobs_api_empty','settings_api','library_api_empty','duplicate_scan_empty','parallel_api_calls','search_synthetic_end_to_end','review_skip','cookie_never_persisted','transcode_roundtrip'}
          root = pathlib.Path('release-assets'); tag = 'v'+version
          core = {f'MusicOps-{version}-Setup.exe', f'MusicOps-{version}-Windows.zip', f'MusicOps-{version}-source.zip'}
          expected = set(core); covered = set(); windows = None
          for platform in ('Windows', 'macOS-arm64'):
              manifest_name = f'MusicOps-{version}-{platform}-build.json'; expected.add(manifest_name)
              data = json.loads((root/manifest_name).read_text('utf-8'))
              if data.get('managed_engines_passed') is not True or not data.get('managed_engine_checks') or not all(data['managed_engine_checks'].values()):raise SystemExit('Native bundled engines acceptance is incomplete')
              if data.get('version') != version or data.get('commit') != commit or data.get('smoke_passed') is not True or data.get('installer_smoke_passed') is not True:
                  raise SystemExit('Build source, version or native acceptance mismatch: '+platform)
              if platform == 'Windows':
                  windows = data
                  if not go_checks.issubset(data.get('packaged_checks',{})):raise SystemExit('Go packaged acceptance did not cover all 23 checks')
                  if data.get('core_version') != version or data.get('desktop_version') != version or data.get('architecture') != 'x86_64' or data.get('unit_tests_passed') is not True or data.get('installer_test_count') != 6 or data.get('source_archive_commit') != commit or not data.get('packaged_checks') or len(data.get('packaged_checks', {})) != 23 or not all(data['packaged_checks'].values()) or len(data.get('installer_smoke_checks', {})) != 6 or not all(data['installer_smoke_checks'].values()):
                      raise SystemExit('Windows regression or packaged evidence is incomplete')
                  names = {f'MusicOps-{version}-Setup.exe', f'MusicOps-{version}-Windows.zip', f'MusicOps-{version}-source.zip'}
              else:
                  arch = platform.removeprefix('macOS-')
                  names = {f'MusicOps-{version}-{platform}.zip', f'MusicOps-{version}-{platform}.pkg', f'MusicOps-{version}-{platform}.dmg'}
                  if data.get('architecture') != arch or data.get('minimum_macos') != '15.0' or data.get('disk_image_smoke_passed') is not True or data.get('core_version') != version or data.get('desktop_version') != version:
                      raise SystemExit('Native Mac architecture, version or disk image mismatch')
                  if len(data.get('installer_smoke_checks', {})) != 11 or not all(data['installer_smoke_checks'].values()):
                      raise SystemExit('Mac installer acceptance is incomplete')
                  if {data.get('archive'), data.get('installer'), data.get('disk_image')} != names:
                      raise SystemExit('Mac ZIP, native PKG and DMG are all required')
                  expected.update({f'MusicOps-{version}-{platform}.sha256', f'MusicOps-{version}-{platform}.sha512'})
                  for algorithm in ('sha256', 'sha512'):
                      lines = (root/f'MusicOps-{version}-{platform}.{algorithm}').read_text('utf-8').splitlines()
                      declared = dict(line.split('  ', 1)[::-1] for line in lines)
                      if declared != {name: data['artifacts'][name][algorithm] for name in names}:
                          raise SystemExit('Mac checksum sidecar mismatch')
                  core.update(names)
              if set(data.get('artifacts', {})) != names:
                  raise SystemExit('Artifact manifest membership mismatch')
              for name, digests in data['artifacts'].items():
                  if pathlib.Path(name).name != name or not (root/name).is_file():
                      raise SystemExit('Missing or unsafe artifact name')
                  for algorithm in ('sha256', 'sha512'):
                      with (root/name).open('rb') as stream:
                          actual = hashlib.file_digest(stream, algorithm).hexdigest()
                      if actual != digests.get(algorithm):
                          raise SystemExit('Artifact checksum mismatch: '+name)
                  covered.add(name)
          expected.update(core)
          if len(core) != 6 or covered != core or {path.name for path in root.iterdir()} != expected:
              raise SystemExit('Release is missing required files or contains unexpected files')
          with zipfile.ZipFile(root/f'MusicOps-{version}-source.zip') as source:
              if source.comment.decode('ascii') != commit:
                  raise SystemExit('Source ZIP is not the tested commit')
          for algorithm in ('sha256', 'sha512'):
              rows = []
              for name in sorted(core):
                  with (root/name).open('rb') as stream:
                      rows.append(hashlib.file_digest(stream, algorithm).hexdigest()+'  '+name+'\n')
              (root/('SHA256SUMS' if algorithm == 'sha256' else 'SHA512SUMS')).write_text(''.join(rows), 'utf-8')
          api_root = 'https://api.github.com/repos/'+os.environ['GH_REPO']
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, payload=None, missing=False):
              request = urllib.request.Request(api_root+path, headers=headers,
                  data=None if payload is None else json.dumps(payload).encode('utf-8'))
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404: return None
                  raise SystemExit('GitHub API failed with HTTP '+str(error.code)) from None
          page = 1
          while True:
              releases = api('/releases?per_page=100&page='+str(page))
              if any(release['tag_name'] == tag for release in releases):
                  raise SystemExit('A release with this version already exists; refusing to overwrite it')
              if len(releases) < 100: break
              page += 1
          reference = api('/git/ref/tags/'+tag, missing=True)
          if reference is None:
              api('/git/refs', {'ref': 'refs/tags/'+tag, 'sha': commit})
          else:
              obj = reference['object']
              for _ in range(5):
                  if obj['type'] != 'tag': break
                  obj = api('/git/tags/'+obj['sha'])['object']
              if obj['type'] != 'commit' or obj['sha'] != commit:
                  raise SystemExit('The existing tag does not identify the tested source')
          notes = pathlib.Path('release-notes.md')
          with zipfile.ZipFile(root/f'MusicOps-{version}-source.zip') as archived_source:
              release_notes = archived_source.read(f'MusicOps-{version}/docs/发布说明.md').decode('utf-8')
          notes.write_text(release_notes.rstrip()+'\n\nSource commit: '+commit+'\n', 'utf-8')
          def gh(*arguments):
              subprocess.run(['gh', *arguments], check=True)
          gh('release', 'create', tag, '--verify-tag', '--target', commit, '--draft', '--title', 'MusicOps '+version, '--notes-file', str(notes))
          files = sorted(path for path in root.iterdir() if path.is_file())
          gh('release', 'upload', tag, *map(str, files))
          # The by-tag endpoint returns published releases. Read this new draft
          # by ID so every asset is verified before it becomes publicly visible.
          created = [release for release in api('/releases?per_page=100') if release['tag_name'] == tag]
          if len(created) != 1:
              raise SystemExit('Could not identify the newly created draft')
          release_id = str(created[0]['id'])
          release = api('/releases/'+release_id)
          assets = {asset['name']: asset for asset in release['assets']}
          if not release['draft'] or set(assets) != {path.name for path in files}:
              raise SystemExit('Uploaded draft membership mismatch; release remains unpublished')
          for path in files:
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              if assets[path.name]['size'] != path.stat().st_size or assets[path.name].get('digest') != 'sha256:'+digest:
                  raise SystemExit('Uploaded asset verification failed; release remains unpublished')
          gh('release', 'edit', tag, '--draft=false', '--latest', '--title', 'MusicOps '+version)
          result = api('/releases/'+release_id)
          if result['draft'] or result['name'] != 'MusicOps '+version:
              raise SystemExit('Published release state did not match the verified draft')
          print('Published '+result['html_url'])

  docker_latest:
    name: Advance Docker latest after the complete release
    needs: [publish, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: wsdbb72
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the exact tested immutable image digest
        env:
          IMAGE_DIGEST: ${{ needs.linux.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --prefer-index=false --tag wsdbb72/muiscops:latest "wsdbb72/muiscops@$IMAGE_DIGEST"
