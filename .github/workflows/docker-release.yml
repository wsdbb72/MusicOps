name: Linux amd64 container
on:
  workflow_call:
    outputs:
      digest:
        description: Tested Docker Hub image digest
        value: ${{ jobs.container.outputs.digest }}
    secrets:
      DOCKERHUB_TOKEN:
        required: true
jobs:
  container:
    name: Build, test and publish Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Read exact version
        id: identity
        shell: python
        run: |
          import os,tomllib
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('version='+version+'\n')
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: musicops-ci:tested
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=musicops-linux-amd64
          cache-to: type=gha,mode=max,scope=musicops-linux-amd64
      - name: Exercise the real browser desktop, credentials, engines and restart
        run: python docker/smoke.py musicops-ci:tested container-reports/acceptance.json
      - name: Verify real Linux vault permissions and missing-key recovery
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/workspace:ro" musicops-ci:tested -c 'python -m pip install --user pytest==9.1.1 && cd /workspace && python -m pytest -q -p no:cacheprovider tests/test_release0415_container.py'
      - name: Preserve synthetic Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MusicOps-Linux-amd64-acceptance
          path: container-reports/*
          if-no-files-found: ignore
          retention-days: 14
      - uses: docker/login-action@v4
        with:
          username: wsdbb72
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image without rebuilding
        id: push
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="wsdbb72/muiscops:${VERSION}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Version already exists; refusing to overwrite $image" >&2
            exit 1
          fi
          docker tag musicops-ci:tested "$image"
          docker push "$image"
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' > manifest.json
          python - <<'PY'
          import json,os
          data=json.load(open('manifest.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('digest='+data['digest']+'\n')
          PY
