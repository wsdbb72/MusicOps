name: Linux amd64 native HTML container
on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (X.Y.Z) supplied by the desktop release workflow'
        type: string
        required: true
    outputs:
      digest:
        description: Tested Docker Hub image digest
        value: ${{ jobs.container.outputs.digest }}
    secrets:
      DOCKERHUB_TOKEN:
        required: true
jobs:
  container:
    name: Build, test and publish Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Set up pinned Go for the container smoke tool
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: native/core/go.sum
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: musicops-ci:tested
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=musicops-linux-amd64
          cache-to: type=gha,mode=max,scope=musicops-linux-amd64
      - name: Exercise native HTML HTTP commands, credentials, engines and restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p container-reports
          cd native/core
          go build -trimpath -o /tmp/docker-smoke ./cmd/docker-smoke
          /tmp/docker-smoke --image musicops-ci:tested --tag ${{ inputs.version }} --report "$GITHUB_WORKSPACE/container-reports/acceptance.json"
      - name: Verify the tested image with the release gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/musicops-bundle
          docker create --name musicops-gate musicops-ci:tested
          docker cp musicops-gate:/opt/musicops /tmp/musicops-bundle
          docker rm musicops-gate
          /tmp/musicops-bundle/releasegate --bundle /tmp/musicops-bundle --version ${{ inputs.version }} --layout docker --require-engines --smoke-report container-reports/acceptance.json
      - name: Preserve synthetic Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MusicOps-Linux-amd64-acceptance
          path: container-reports/*
          if-no-files-found: ignore
          retention-days: 14
      - uses: docker/login-action@v4
        with:
          username: wsdbb72
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image without rebuilding
        id: push
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="wsdbb72/muiscops:${VERSION}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Version already exists; refusing to overwrite $image" >&2
            exit 1
          fi
          docker tag musicops-ci:tested "$image"
          docker push "$image"
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' > manifest.json
          python - <<'PY'
          import json,os
          data=json.load(open('manifest.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('digest='+data['digest']+'\n')
          PY
