name: macOS app and release assets

on:
  push:
    branches: ['codex/**', '!codex/release-*']
  workflow_call:
    inputs:
      ref:
        description: 'Exact source commit supplied by the desktop release workflow'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build (manual runs save artifacts only)'
        type: string
        required: false
        default: main

permissions:
  contents: read
  checks: write

concurrency:
  # A called workflow must never share the caller's cancellation group.
  group: musicops-macos-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    env:
      PYTHONIOENCODING: utf-8
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Set up native Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: packaging/requirements-macos.txt
      - name: Set up pinned Go for bundled engines
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install reviewed build dependencies
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install --only-binary=cryptography -r packaging/requirements-macos.txt
          python -m pip install --no-deps -e .
      - name: Create an isolated unlocked test keychain
        shell: bash
        run: |
          MUSICOPS_KEYCHAIN_PATH="$RUNNER_TEMP/musicops-ci.keychain-db"
          printf 'MUSICOPS_KEYCHAIN_PATH=%s\n' "$MUSICOPS_KEYCHAIN_PATH" >> "$GITHUB_ENV"
          TASK_KEYCHAIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$TASK_KEYCHAIN_PASSWORD"
          security create-keychain -p "$TASK_KEYCHAIN_PASSWORD" "$MUSICOPS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$MUSICOPS_KEYCHAIN_PATH"
          security unlock-keychain -p "$TASK_KEYCHAIN_PASSWORD" "$MUSICOPS_KEYCHAIN_PATH"
      - name: Run real macOS Keychain, Unix IPC and file-lock regression tests
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/macos/reports
          python -m pytest tests/test_platform_runtime.py tests/test_native_paths.py -q \
            --basetemp "$RUNNER_TEMP/musicops-platform-pytest" \
            --junitxml "dist/macos/reports/platform-runtime-$BUILD_ARCH.xml"
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path('dist/macos/reports') / ('platform-runtime-' + os.environ['BUILD_ARCH'] + '.xml')
          cases = {case.attrib['name']: case for case in ET.parse(report).iter('testcase')}
          required = {
              'test_macos_real_keychain_ciphertext_decrypts_in_fresh_process',
              'test_macos_real_unix_worker_authentication_and_private_permissions',
              'test_macos_stale_socket_cleanup_refuses_regular_files',
              'test_macos_writer_lock_excludes_a_second_process',
          }
          for name in required:
              if name not in cases or any(child.tag in {'skipped', 'failure', 'error'} for child in cases[name]):
                  raise SystemExit('A required native macOS runtime test did not execute successfully: ' + name)
          PY
      - name: Build app, verify ad-hoc signatures, run packaged acceptance and archive
        id: native_build
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/macos/reports
          set -o pipefail
          python packaging/build_macos.py --arch "$BUILD_ARCH" --output dist/macos 2>&1 | tee dist/macos/reports/native-build.log
      - name: Save a directly readable native diagnostic check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.native_build.outcome }}
        run: python packaging/publish_ci_diagnostics.py
      - name: Save tested release files
        uses: actions/upload-artifact@v7
        with:
          name: MusicOps-macOS-${{ matrix.arch }}
          path: |
            dist/macos/MusicOps-*-macOS-*.zip
            dist/macos/MusicOps-*-macOS-*.pkg
            dist/macos/MusicOps-*-macOS-*.dmg
            dist/macos/MusicOps-*-macOS-*.sha256
            dist/macos/MusicOps-*-macOS-*.sha512
            dist/macos/MusicOps-*-macOS-*-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Save native acceptance report and screenshots
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MusicOps-macOS-${{ matrix.arch }}-acceptance
          path: |
            dist/macos/reports/*.json
            dist/macos/reports/*.xml
            dist/macos/reports/*.log
            dist/macos/smoke/*window.png
            dist/macos/installer-smoke/installed-app/*window.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Delete only the temporary test keychain
        if: always()
        shell: bash
        run: |
          if [[ -f "$MUSICOPS_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$MUSICOPS_KEYCHAIN_PATH"
          fi
