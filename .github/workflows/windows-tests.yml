name: Windows tests

on:
  push:
    branches: [main, 'codex/**', '!codex/release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Install media tools for synthetic CI tests
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'FFmpeg CI installation failed' }
          ffmpeg -version
          ffprobe -version
      - name: Locate the native Windows installer compiler
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compilerPath = if ($compiler) { $compiler.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path -LiteralPath $compilerPath)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Inno Setup CI installation failed' }
            $compilerPath = @('Inno Setup 7', 'Inno Setup 6') | ForEach-Object { Join-Path ${env:ProgramFiles(x86)} "$_\ISCC.exe" } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compilerPath) { throw 'Installer compiler was not found' }
          "INNO_ISCC=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests including real install and upgrade verification
        run: python -m pytest -q
