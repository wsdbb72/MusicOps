[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musicops"
version = "0.4.22"
description = "MusicOps desktop music library manager for Windows, macOS and Linux Docker"
requires-python = ">=3.12"
dependencies = [
  "qrcode==8.2","PySide6", "mutagen", "httpx", "Pillow", "cryptography", "opencc-python-reimplemented==0.1.7"]

[project.scripts]
musicops = "musicops.cli:main"
musicops-worker = "musicops.worker.server:main"

[project.gui-scripts]
musicops-gui = "musicops.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicops = ["assets/*.png", "assets/*.ico", "web/static/*.html", "web/static/*.js", "web/static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
