[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musicops"
version = "0.3.0"
description = "MusicOps Windows music library manager"
requires-python = ">=3.12"
dependencies = ["PySide6", "mutagen", "httpx", "Pillow", "cryptography"]

[project.scripts]
musicops = "musicops.cli:main"
musicops-worker = "musicops.worker.server:main"

[project.gui-scripts]
musicops-gui = "musicops.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
